[browser]
# Privacy: never phone usage statistics home to Streamlit.
gatherUsageStats = false

[server]
# Script-level config for the launcher: Streamlit loads the config beside
# the main script (launcher.py) plus the one in the launch folder — page
# apps' own configs (e.g. data-diff-duckdb-sandbox) are NOT inherited.
# Keeping maxUploadSize here makes the 1 GB upload ceiling apply to every
# launcher page no matter which folder the launcher is started from.
maxUploadSize = 1000
# Bind loopback only — never expose the local server (and its in-memory
# company data) to other machines on the same Wi-Fi/LAN.
address = "127.0.0.1"
